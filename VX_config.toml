# Each `VX_CFG_X_ENABLE` boolean auto-generates its integer mirror `VX_CFG_X_ENABLED` (0/1); author only the boolean.

[platform]
VX_CFG_NUM_CLUSTERS = 1
VX_CFG_NUM_CORES = 1
VX_CFG_SOCKET_SIZE = 1

VX_CFG_RESET_DELAY = 8

# lowercase = private helper, not emitted as a VX_CFG_ macro
dpi_is_enabled = "expr: $SV_DPI"

VX_CFG_ICACHE_ENABLE = true
VX_CFG_DCACHE_ENABLE = true
VX_CFG_LMEM_ENABLE = true
VX_CFG_L2_ENABLE = false
VX_CFG_L3_ENABLE = false


[isa]

VX_CFG_VM_ENABLE = false

VX_CFG_EXT_D_ENABLE = "expr: $VX_CFG_XLEN_64"
VX_CFG_FLEN = "expr: 64 if $VX_CFG_EXT_D_ENABLE else 32"

VX_CFG_EXT_M_ENABLE = true
VX_CFG_EXT_F_ENABLE = true
VX_CFG_EXT_C_ENABLE = false
VX_CFG_EXT_A_ENABLE = false
# Zacas: native compare-and-swap (amocas). Requires the A extension -- it adds
# an atomic, it does not replace the set. Off by default because it widens the
# memory request with a comparand operand.
VX_CFG_EXT_ZACAS_ENABLE = false

VX_CFG_EXT_ZICOND_ENABLE = true
# Zfhmin: half-precision load/store, move and fp16<->fp32/fp64 conversion (no
# half arithmetic). Requires F.
VX_CFG_EXT_ZFHMIN_ENABLE = false
VX_CFG_EXT_TCU_ENABLE = false
VX_CFG_EXT_DMA_ENABLE = false
VX_CFG_EXT_DXA_ENABLE = false
VX_CFG_EXT_TEX_ENABLE = false
VX_CFG_EXT_RASTER_ENABLE = false
VX_CFG_EXT_OM_ENABLE = false
VX_CFG_EXT_RTU_ENABLE = false
VX_CFG_EXT_TFU_ENABLE = false
# Wide loads and stores (vx_flw.d/.q, vx_fsw.d/.q): 2 or 4 consecutive words
# to or from an aligned FP register group, one flw/fsw uop per word. Requires
# F with FLEN 32 (no D).
VX_CFG_EXT_LDST_WIDE_ENABLE = false
# Matrix loads and stores (vx_ldm, vx_stm): a warp's matrix fragment, one
# flw/fsw uop per register, in the fragment register layout the TCU reads.
# Requires F; does not require the TCU.
VX_CFG_EXT_LDST_MATRIX_ENABLE = false
VX_CFG_VLEN = "expr: $VX_CFG_XLEN * 4"

[pipeline]
VX_CFG_NUM_WARPS = 4
VX_CFG_NUM_THREADS = 4
VX_CFG_NUM_BARRIERS = 8

# What a barrier waits for in the LSU before its arrival counts. 0: every
# request of the core, queued or a read awaiting its response, whatever warp
# made it. 1: for a barrier that stalls its warp (vx_barrier, vx_barrier_wait),
# the warp's own instructions committed, so its loads are answered; and, of
# every warp of the core and loads as well as stores, no request still queued
# in an LSU block and none on its way to the data cache (coalescer, lane
# adapter, flush port, the core's dMMU lanes, the link) or a store to local
# memory. A read waiting at the caches or memory no longer holds it; requests
# other CTAs still have queued or on that path do. An arrive
# (vx_barrier_arrive, expect_tx), after which its warp runs on, waits as 0.
# 1 is what an H200 does:
# 16 CTAs of an SM staging with loads take 2503-2536 cycles an iteration
# whether they start in step or staggered, and a CTA doing register work and
# barriers beside CTAs streaming global loads goes from 71 to 79 cycles an
# iteration (study/results_gpu/h200_borrow_e4_stage8.txt, _probe2.txt).
VX_CFG_BAR_DRAIN_SCOPE = 0
VX_CFG_MAX_BAR_EVENTS = 32

VX_CFG_IBUF_SIZE = 4
# Fetches one warp may have between its fetch pick and decode: 1, or a power
# of two. 1 stalls the warp from its pick until decode, or for a branch or
# warp-control instruction until that resolves. More lets a warp that is the
# only runnable warp of its frontend slice fetch sequentially ahead, within
# its instruction-buffer slots (IBUF_SIZE) and, with VM, within the page of
# its last fetch. Decode drops what was fetched behind a stalling instruction
# and a fetch that arrives ahead of an older one, and the warp refetches from
# there once the dropped fetches have all returned. Requires EXT_C off.
VX_CFG_FETCH_INFLIGHT = 1
# 1 buffers a fetch pick in the warp scheduler before the fetch unit's
# request buffer; 0 sends the pick straight to that buffer, so the request
# reaches the icache one cycle earlier. The fetch unit's buffer still
# registers the request and gives the pick a registered ready. Requires EXT_C
# off.
VX_CFG_FETCH_REQ_BUF = 1
# 1 registers the first frontend slice's icache requests once more where the
# core's cache flush is merged into them, a cycle the other slices do not
# have; 0 merges the flush through a priority mux behind the fetch unit's
# registered request. The flush leaves in the same order with fetches either
# way.
VX_CFG_FLUSH_REQ_BUF = 1
# 1 treats a floating-point operation's exception flags as an accumulation
# (sticky OR): the scoreboard counts a warp's FP operations in flight instead
# of reserving fflags for each, so they no longer issue one at a time. A CSR
# access of fflags or fcsr waits for the count to reach zero, and an FP
# operation waits for a CSR write of them in flight. The flags then have a
# scoreboard slot of their own, so the TCU metadata loads that share the slot
# at 0 no longer wait for FP operations. 0 serializes the flag writes.
VX_CFG_FFLAGS_ACCUM = 0
# A unit narrower than the warp takes an instruction in NUM_THREADS / lanes
# packets through a registered packet iterator (SIMD widths above 12). At 0 an
# op leaves its dispatch queue as its last packet leaves the register, and the
# next op's first packet enters a cycle later: one empty cycle per op. A set
# bit removes that cycle for one unit (1 ALU, 2 LSU, 4 SFU, 8 FPU, 16 TCU):
# the op leaves its queue as the register takes its last packet, and its
# fields travel with each packet. Applies to a unit whose blocks each have
# one dispatch queue (blocks = ISSUE_WIDTH); a bit is ignored for a unit
# with fewer blocks than issue slots, at SIMD widths up to 12 and for a unit
# as wide as the warp. Costs a register for the op's fields per block.
VX_CFG_LANE_DISPATCH_GAPLESS = 0
# 1 registers a resolved branch between the integer ALU and the warp
# scheduler; 0 sends it straight from the ALU's result register, so the warp
# is picked at the branch target one cycle earlier. The register has no
# function: it shortens the path from the ALU block to the scheduler's
# per-warp PC and stall logic.
VX_CFG_BRANCH_REG = 1
VX_CFG_DISPATCH_QUEUE_SIZE = 4
# A power of two: a warp's issue slice is the low bits of its id.
VX_CFG_ISSUE_WIDTH = "expr: pow(2, clog2(up($VX_CFG_NUM_WARPS / 16)))"
# Fetch slices, each scheduling and fetching its own warps on its own icache
# port: a power of two that divides ISSUE_WIDTH. One per issue slice by
# default (the largest power of two dividing ISSUE_WIDTH).
VX_CFG_FETCH_WIDTH = "expr: $VX_CFG_ISSUE_WIDTH & -$VX_CFG_ISSUE_WIDTH"
VX_CFG_SIMD_WIDTH = "expr: $VX_CFG_NUM_THREADS"
VX_CFG_NUM_OPCS = "expr: up($VX_CFG_NUM_WARPS / (4 * $VX_CFG_ISSUE_WIDTH))"
# With more than one operand collector per issue slice, 1 registers their
# round-robin merge; 0 merges them through a mux into the dispatch queues, so
# an operation reaches its queue one cycle earlier. No effect with one
# collector.
VX_CFG_OPC_MERGE_BUF = 1
VX_CFG_NUM_GPR_BANKS = 4
VX_CFG_NUM_VGPR_BANKS = 2

[memory]
VX_CFG_MEM_BLOCK_SIZE = 64
VX_CFG_MEM_ADDR_WIDTH = "expr: 48 if $VX_CFG_XLEN_64 else 32"

# L1 block = memory bus (MEM_BLOCK), shared by icache/dcache/gfx + L2 input word.
# L2/L3 are sectored: a doubled line halves tags while the sector (= MEM_BLOCK)
# stays the fill/transaction granule. When a level is disabled it is a passthrough
# and forwards the upstream granule unchanged.
VX_CFG_L1_LINE_SIZE   = "expr: $VX_CFG_MEM_BLOCK_SIZE"
VX_CFG_L2_LINE_SIZE   = "expr: (2 * $VX_CFG_MEM_BLOCK_SIZE) if $VX_CFG_L2_ENABLE else $VX_CFG_L1_LINE_SIZE"
VX_CFG_L2_SECTOR_SIZE = "expr: $VX_CFG_MEM_BLOCK_SIZE if $VX_CFG_L2_ENABLE else $VX_CFG_L1_LINE_SIZE"
VX_CFG_L3_LINE_SIZE   = "expr: (2 * $VX_CFG_MEM_BLOCK_SIZE) if $VX_CFG_L3_ENABLE else $VX_CFG_L2_SECTOR_SIZE"
VX_CFG_L3_SECTOR_SIZE = "expr: $VX_CFG_MEM_BLOCK_SIZE if $VX_CFG_L3_ENABLE else $VX_CFG_L2_SECTOR_SIZE"

[platform_memory]
VX_CFG_PLATFORM_MEMORY_NUM_BANKS = 2
VX_CFG_PLATFORM_MEMORY_ADDR_WIDTH = "expr: 48 if $VX_CFG_XLEN_64 else 32"
VX_CFG_PLATFORM_MEMORY_DATA_SIZE = 64
VX_CFG_PLATFORM_MEMORY_INTERLEAVE = 1
VX_CFG_PLATFORM_MEMORY_PEAK_BW = 460000 # 460 GB/s
VX_CFG_PLATFORM_CLOCK_RATE = 400
# DRAM the simulators model behind each memory bank (one channel per bank),
# as a data sheet gives it: the JEDEC standard, its data rate (MT/s per pin),
# the fixed read latency added for the PHY, controller and interconnect (core
# cycles), and the requests a channel holds in flight (0 = unbounded).
# Simulation-only: the RTL never reads them. The default clocks the DRAM with
# the core: 14 cycles for an idle open-row read, 26 for a row conflict, one
# 64 B block per cycle at peak; profiles set their own.
VX_CFG_PLATFORM_MEMORY_TYPE = "HBM2"
VX_CFG_PLATFORM_MEMORY_DATA_RATE = "expr: 2 * $VX_CFG_PLATFORM_CLOCK_RATE"
VX_CFG_PLATFORM_MEMORY_LATENCY = 0
VX_CFG_PLATFORM_MEMORY_QUEUE_SIZE = 0
# The DRAM controller and organization the simulators model, simulation-only
# as the lines above. BANK_GROUPS: bank groups per pseudo-channel of an HBM
# part, four banks each (4, 8 or 16; JESD238 parts have one set of 16 banks per
# stack ID). SCHED_WINDOW: the read, and write, bursts a channel's scheduler
# chooses among (Ramulator's 32). INTERLEAVE_SIZE: bytes of consecutive
# addresses kept on one channel; one block is the plain interleave, a larger
# power of two (up to a 1 KB row) is kept whole in one bank's row with the
# channel and bank mixed by a hash of the address bits above them.
VX_CFG_PLATFORM_MEMORY_BANK_GROUPS = 4
VX_CFG_PLATFORM_MEMORY_SCHED_WINDOW = 32
VX_CFG_PLATFORM_MEMORY_INTERLEAVE_SIZE = "expr: $VX_CFG_PLATFORM_MEMORY_DATA_SIZE"
# Little's law: the bytes the chip keeps in flight to sustain its peak memory
# bandwidth (MB/s over MHz is bytes per clock) across the memory latency. The
# miss-tracking depths derive from it and stay at their floors when the
# latency is zero, as in the default.
mem_bytes_in_flight = "expr: ($VX_CFG_PLATFORM_MEMORY_PEAK_BW // $VX_CFG_PLATFORM_CLOCK_RATE) * $VX_CFG_PLATFORM_MEMORY_LATENCY"
# Above the L2 a miss also crosses the link to it, both ways.
l1_mem_bytes_in_flight = "expr: ($VX_CFG_PLATFORM_MEMORY_PEAK_BW // $VX_CFG_PLATFORM_CLOCK_RATE) * ($VX_CFG_PLATFORM_MEMORY_LATENCY + 2 * $VX_CFG_L2_LINK_LATENCY)"
# Above the dcache a load also crosses the link to it, both ways.
lsu_mem_bytes_in_flight = "expr: ($VX_CFG_PLATFORM_MEMORY_PEAK_BW // $VX_CFG_PLATFORM_CLOCK_RATE) * ($VX_CFG_PLATFORM_MEMORY_LATENCY + 2 * $VX_CFG_L2_LINK_LATENCY + 2 * $VX_CFG_L1_LINK_LATENCY)"

[alu]
VX_CFG_NUM_ALU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_ALU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"

[sfu]
VX_CFG_NUM_SFU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_SFU_BLOCKS = 1

[lsu]
VX_CFG_NUM_LSU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_LSU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"
# Interleave the per-thread stacks by word, so a warp-wide access to one frame
# slot fills a single line instead of one same-bank line per thread.
VX_CFG_LSU_STACK_INTERLEAVE_ENABLE = true

VX_CFG_LSU_LINE_SIZE = "expr: min($VX_CFG_NUM_LSU_LANES * ($VX_CFG_XLEN / 8), $VX_CFG_L1_LINE_SIZE)"
VX_CFG_LSU_QUEUE_IN_SIZE = "expr: max(4, 2 * ($VX_CFG_SIMD_WIDTH // $VX_CFG_NUM_LSU_LANES))"
# Outstanding-load pool (MLP depth): decoupled from the input staging queue and
# provisioned for miss-latency hiding (~2 in-flight loads per warp), bounded by
# LSU_PENDING_LIMIT.
VX_CFG_LSU_PENDING_SIZE = "expr: min($VX_CFG_LSU_PENDING_LIMIT, max(8, 2 * $VX_CFG_NUM_WARPS * ($VX_CFG_SIMD_WIDTH // $VX_CFG_NUM_LSU_LANES)))"
# The pool's bound: an LSU block's share of the memory bytes in flight, in
# full packets, and at least 32, which keeps the slot id cheap in the dcache tag.
VX_CFG_LSU_PENDING_LIMIT = "expr: clamp(pow(2, clog2(($lsu_mem_bytes_in_flight + $lsu_inflight_bytes - 1) // $lsu_inflight_bytes)), 32, 256)"
lsu_inflight_bytes = "expr: $VX_CFG_NUM_CLUSTERS * $VX_CFG_NUM_CORES * $VX_CFG_NUM_LSU_BLOCKS * $VX_CFG_LSU_LINE_SIZE"
# The mem-side queue depth is not a knob: it sets the dcache-facing tag-id
# width and must cover the outstanding pool, so each implementation derives
# it internally from the pool size.

[fpu]
# string enum: 'DPI'|'DSP'|'FPNEW'|'STD'; synth ASIC=>STD FPGA=>DSP, sim DPI/STD
VX_CFG_FPU_TYPE = "expr: ('STD' if $ASIC else 'DSP') if $SYNTHESIS else ('DPI' if $dpi_is_enabled else 'STD')"

VX_CFG_NUM_FPU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_FPU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"
VX_CFG_FPU_QUEUE_SIZE = "expr: 2 * ($VX_CFG_SIMD_WIDTH // $VX_CFG_NUM_FPU_LANES)"
# Map the soft FPU (STD) mantissa multipliers onto DSP48: on for FPGA synth, off
# for ASIC/sim (mirrors VX_CFG_TCU_USE_DSP). Single source of truth.
VX_CFG_FPU_USE_DSP = "expr: 1 if ($SYNTHESIS and not $ASIC) else 0"

fpu_dsp_quartus = "expr: $VX_CFG_FPU_TYPE_DSP and $QUARTUS"
fpu_dsp_vivado  = "expr: $VX_CFG_FPU_TYPE_DSP and $VIVADO"

# STD: FDIV_LATENCY must equal FSQRT_LATENCY (shared serializer in VX_fpu_std)
VX_CFG_FMA_LATENCY  = "expr: 16 if $fpu_dsp_vivado else (4 if $fpu_dsp_quartus else (12 if $VX_CFG_EXT_D_ENABLE else 8))"
# STD timing; DPI is a fast STD and takes the same values.
fdiv_latency_std  = "expr: 32 if $VX_CFG_EXT_D_ENABLE else 17"
fsqrt_latency_std = "expr: $fdiv_latency_std"
# The vendor divide and square-root IP is F32 only; with D they are the RTL cores.
fdiv_latency_dsp  = "expr: 32 if $VX_CFG_EXT_D_ENABLE else (15 if $QUARTUS else (28 if $VIVADO else 17))"
fsqrt_latency_dsp = "expr: 32 if $VX_CFG_EXT_D_ENABLE else (10 if $QUARTUS else (28 if $VIVADO else 17))"

VX_CFG_FDIV_LATENCY = "expr: 16 if $VX_CFG_FPU_TYPE_FPNEW else ($fdiv_latency_dsp if $VX_CFG_FPU_TYPE_DSP else $fdiv_latency_std)"
VX_CFG_FSQRT_LATENCY= "expr: 16 if $VX_CFG_FPU_TYPE_FPNEW else ($fsqrt_latency_dsp if $VX_CFG_FPU_TYPE_DSP else $fsqrt_latency_std)"
VX_CFG_FNCP_LATENCY = 2
VX_CFG_FCVT_LATENCY = 5

# Lanes per processing element of each FPU class: a class serves its lanes on
# NUM_FPU_LANES / ratio PEs (at least one), so an instruction holds the FPU's
# input for that many cycles. FMA64 sets the F64 FMA rate on its own; when it
# differs from FMA, the F64 FMAs get a separate pool of F64-only PEs.
VX_CFG_FMA_PE_RATIO  = 1
VX_CFG_FMA64_PE_RATIO= 1
VX_CFG_FDIV_PE_RATIO = 1
VX_CFG_FSQRT_PE_RATIO= 1
VX_CFG_FCVT_PE_RATIO = 1
VX_CFG_FNCP_PE_RATIO = 1

[tfu]
# TFU datapath lanes inside the SFU; the SFU's lanes are serialized onto them.
VX_CFG_NUM_TFU_LANES = 1

[amo]
# LR/SC reservation stations per LLC bank; line-indexed in BRAM, eviction yields legal spurious SC failures
VX_CFG_AMO_RS_SIZE = "expr: max($VX_CFG_NUM_WARPS, up($VX_CFG_NUM_CORES * $VX_CFG_NUM_WARPS / $VX_CFG_L2_NUM_BANKS))"

[vpu]
VX_CFG_NUM_VPU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_VPU_BLOCKS = 1

[vm]
# VM page-table format is a HW<->SW contract, moved to VX_types.toml [vm]; TLB depth stays here.
VX_CFG_TLB_SIZE = 32

# L1 TLB stage (per core): D-side / I-side entries and the per-instance
# miss station depth (distinct outstanding VPN misses).
VX_CFG_DTLB_SIZE        = 16
VX_CFG_ITLB_SIZE        = 8
VX_CFG_L1_TLB_MSHR_SIZE = 4

# Socket unit MMU: one TLB per socket for the socket-resident units' memory
# ports (TEX tcache misses, RTU rtcache misses, DXA gmem reads), kept apart
# from the dTLB so texture and BVH traffic cannot evict the cores' translations.
VX_CFG_UTLB_SIZE        = 8

# Cluster unit MMU: one TLB per cluster for the rcache and ocache memory ports
# (raster and OM), a client of the cluster TLB like a socket.
VX_CFG_CTLB_SIZE        = 8

# Shared cluster TLB and page-table walker complex.
VX_CFG_L2_TLB_SIZE         = 512
VX_CFG_L2_TLB_NUM_WAYS     = 4
VX_CFG_L2_TLB_MEGA_SIZE    = 8
VX_CFG_L2_TLB_MSHR_SIZE    = 8
VX_CFG_L2_TLB_LATENCY      = 4
VX_CFG_PTW_NUM_WALKERS     = 2
VX_CFG_PTW_WALK_CACHE_SIZE = 16

VX_CFG_VM_PINNED_REGION_SIZE = 0x10000000   # 256 MB

[cache]
# Cache replacement-policy enums + LLC/topology helpers, consumed by the
# per-level cache sections below and by [amo].
__cache_repl_random = 0
__cache_repl_fifo   = 1
__cache_repl_plru   = 2

# Write-back only at a cache level that is BOTH the LLC AND the single coherence
# point for all cores. A private cache acting as the LLC across multiple
# cores/clusters has no shared coherence point, so its dirty data never becomes
# visible to the other cores and it must stay write-through (stores reach shared
# memory). The dcache is per-core and L2 is per-cluster, so each is a valid
# write-back LLC only when there is exactly one instance; L3 is always global.
l2_is_llc = "expr: $VX_CFG_L2_ENABLED == 1 and $VX_CFG_L3_ENABLED == 0"
dcache_is_llc = "expr: $VX_CFG_L2_ENABLED == 0 and $VX_CFG_L3_ENABLED == 0"
l3_is_llc = "expr: $VX_CFG_L3_ENABLED == 1"
single_core = "expr: $VX_CFG_NUM_CORES == 1 and $VX_CFG_NUM_CLUSTERS == 1"
single_cluster = "expr: $VX_CFG_NUM_CLUSTERS == 1"

# The command processor's DMA becomes a client of the last-level cache, which
# is then the point of coherence for host transfers: they need no cache flush.
# Only a last-level cache that alone serves every core can take it (an L2 with
# one cluster, or an L3); VX_CFG_CP_ON_LLC is set where it took effect.
VX_CFG_CP_LLC_CLIENT = 1
VX_CFG_CP_ON_LLC = "expr: int($VX_CFG_CP_LLC_CLIENT != 0 and (($l2_is_llc and $single_cluster) or $l3_is_llc))"

[l1cache]
VX_CFG_ICACHE_SIZE = 16384
VX_CFG_ICACHE_NUM_WAYS = 4
VX_CFG_ICACHE_REPL_POLICY = "expr: $__cache_repl_fifo"
VX_CFG_ICACHE_MSHR_SIZE = 16
VX_CFG_ICACHE_MRSQ_SIZE = 0
# mem-request queue depth override; 0 = bank-derived minimum, raise to add slots
VX_CFG_ICACHE_MREQ_SIZE = 0
VX_CFG_ICACHE_CRSQ_SIZE = 0
VX_CFG_ICACHE_MEM_PORTS = 1
# banks behind the fetch-slice request ports
VX_CFG_ICACHE_NUM_BANKS = "expr: pow(2, clog2($VX_CFG_FETCH_WIDTH))"
# Merge same-line fetches from the core's slices in the same cycle into one
# bank access; the response goes to every merged slice, each with its word.
VX_CFG_ICACHE_READ_MERGE = 1
VX_CFG_ICACHE_LATENCY = "expr: 2 + max(0, clog2($VX_CFG_ICACHE_SIZE) - clog2(16384))"

VX_CFG_DCACHE_SIZE = 16384
VX_CFG_DCACHE_NUM_WAYS = 4
# Coalescer/bank granule (banks = footprint/word, NUM_BANKS = NUM_REQS). Word is
# reduced ~sqrt(lanes) below the block so banks scale for MLP while the word/bus
# stays moderate: NT 1/2/4/8/16/32/64 -> word 4/8/8/16/16/32/32, banks 1/1/2/2/4/4/8.
VX_CFG_DCACHE_WORD_SIZE = "expr: min($VX_CFG_L1_LINE_SIZE, min($VX_CFG_MEM_BLOCK_SIZE, ($VX_CFG_XLEN / 8) * pow(2, (clog2($VX_CFG_NUM_LSU_LANES) + 1) / 2)))"
VX_CFG_DCACHE_WRITEBACK = "expr: int($dcache_is_llc and $single_core)"
# LAZY_FETCH: a store miss allocates its line without a fill and a later read
# fetches and merges under the dirty bytes (write-validate, as GPU L2s do). It
# is on wherever the cache is a write-back LLC, the only place it is legal. It
# needs the per-byte dirty masks, so it turns DIRTYBYTES on; DIRTYBYTES alone
# keeps fetch-on-write. The same pair exists for L2 and L3.
VX_CFG_DCACHE_DIRTYBYTES = "expr: $VX_CFG_DCACHE_LAZY_FETCH"
VX_CFG_DCACHE_LAZY_FETCH = "expr: int($VX_CFG_DCACHE_WRITEBACK and $dcache_is_llc)"
VX_CFG_DCACHE_REPL_POLICY = "expr: $__cache_repl_fifo"
# Misses per bank: the bank's share of the memory bytes in flight, in sectors,
# rounded up to a power of two, here and at the L2 and L3. The floor is the
# depth a platform without a memory latency, or a disabled level, gets.
VX_CFG_DCACHE_MSHR_SIZE = "expr: clamp(pow(2, clog2(($l1_mem_bytes_in_flight + $dcache_inflight_bytes - 1) // $dcache_inflight_bytes)), 16, 64) if $VX_CFG_DCACHE_ENABLE else 16"
dcache_inflight_bytes = "expr: $VX_CFG_NUM_CLUSTERS * up($VX_CFG_NUM_CORES // $VX_CFG_SOCKET_SIZE) * up($VX_CFG_NUM_DCACHES) * $VX_CFG_DCACHE_NUM_BANKS * $VX_CFG_DCACHE_SECTOR_SIZE"
# dcache is unsectored: line = sector = mem transaction granule = L1_LINE (which
# defaults to MEM_BLOCK but can be configured smaller). Banking comes from the
# reduced WORD above (>= sector is clamped), not the line. Deriving from L1_LINE
# (rather than hardcoding MEM_BLOCK) keeps line/sector/word/mem-bus consistent
# when L1_LINE is overridden, so a sub-block line stays a valid sectored config.
VX_CFG_DCACHE_LINE_SIZE = "expr: $VX_CFG_L1_LINE_SIZE"
VX_CFG_DCACHE_SECTOR_SIZE = "expr: $VX_CFG_L1_LINE_SIZE"
VX_CFG_DCACHE_LATENCY = "expr: 2 + max(0, clog2($VX_CFG_DCACHE_SIZE) - clog2(16384))"
# The link between a core's memory port and the dcache, in cycles each way: a
# request reaches the dcache, and its response the core, this many cycles
# later, at full throughput, so every global access (an L1 hit, and every
# miss) grows by twice it, and shared memory, inside the core, does not. It
# stands for a GPU whose global loads go through its L1/texture pipeline,
# which DCACHE_LATENCY (the bank pipeline) is not. The dcache MSHRs do not
# wait on it; the LSU's pending pool does.
VX_CFG_L1_LINK_LATENCY = 0
VX_CFG_DCACHE_MRSQ_SIZE = 4
VX_CFG_DCACHE_MREQ_SIZE = 0
VX_CFG_DCACHE_CRSQ_SIZE = 0
# SimX only: a fill-forward head that finds the bank's core-response queue full
# waits for it, as the RTL's does (VX_cache_bank fwd_head), and fills wait with
# it; 0 keeps the model's replay of that head through the bank pipeline.
VX_CFG_DCACHE_FWD_HOLD = 0

VX_CFG_NUM_ICACHES = "expr: up($VX_CFG_SOCKET_SIZE / 4) if $VX_CFG_ICACHE_ENABLE else 0"
VX_CFG_NUM_DCACHES = "expr: up($VX_CFG_SOCKET_SIZE / 4) if $VX_CFG_DCACHE_ENABLE else 0"

VX_CFG_DCACHE_NUM_BANKS = "expr: pow(2, clog2(min($VX_CFG_DCACHE_NUM_REQS, 16)))"
# XOR/IPOLY bank-select hash, so power-of-two strides spread over the banks.
# With two banks it can only swap a line on parity, and the extra parallel
# misses cost more in memory queuing than the spreading saves.
VX_CFG_DCACHE_BANK_HASH = "expr: int($VX_CFG_DCACHE_NUM_BANKS >= 4)"
# XOR-fold set-index hash, so power-of-two strides walk the sets instead of
# piling into the few sets their raw index bits select.
VX_CFG_DCACHE_SET_HASH = 1
# One bank access serves a warp's same-word reads arriving together on its
# coalescer channels (uniform loads), and the response returns to all of
# them in the same cycle.
VX_CFG_DCACHE_READ_MERGE = 1

VX_CFG_L1_MEM_PORTS = "expr: min($VX_CFG_DCACHE_NUM_BANKS, $VX_CFG_PLATFORM_MEMORY_NUM_BANKS) if ($VX_CFG_ICACHE_ENABLE or $VX_CFG_DCACHE_ENABLE) else min($VX_CFG_DCACHE_NUM_REQS, $VX_CFG_PLATFORM_MEMORY_NUM_BANKS)"

[l2cache]
VX_CFG_L2_SIZE = 1048576
VX_CFG_L2_NUM_WAYS = 8
VX_CFG_L2_WRITEBACK = "expr: int($l2_is_llc and $single_cluster)"
VX_CFG_L2_DIRTYBYTES = "expr: $VX_CFG_L2_LAZY_FETCH"
VX_CFG_L2_LAZY_FETCH = "expr: int($VX_CFG_L2_WRITEBACK and $l2_is_llc)"
VX_CFG_L2_REPL_POLICY = "expr: $__cache_repl_fifo"
VX_CFG_L2_MSHR_SIZE = "expr: clamp(pow(2, clog2(($mem_bytes_in_flight + $l2_inflight_bytes - 1) // $l2_inflight_bytes)), 16, 256) if $VX_CFG_L2_ENABLE else 16"
l2_inflight_bytes = "expr: $VX_CFG_NUM_CLUSTERS * $VX_CFG_L2_NUM_BANKS * $VX_CFG_L2_SECTOR_SIZE"
VX_CFG_L2_LATENCY = "expr: 4 + max(0, clog2($VX_CFG_L2_SIZE) - clog2(1048576))"
# The link between the sockets and the L2, in cycles each way: a request
# reaches the L2, and its response the socket, this many cycles later, at full
# throughput, so an L2 hit's round trip grows by twice it. It stands for a
# large GPU's SM-to-L2 network, which L2_LATENCY (the bank pipeline) is not.
VX_CFG_L2_LINK_LATENCY = 0
VX_CFG_L2_MRSQ_SIZE = 4
VX_CFG_L2_MREQ_SIZE = 0
VX_CFG_L2_CRSQ_SIZE = 0
# SimX only: as VX_CFG_DCACHE_FWD_HOLD, for the L2's banks (the same
# VX_cache_bank): a forwarded fill waits on a full core-response queue instead
# of being replayed. 0 keeps the model's replay.
VX_CFG_L2_FWD_HOLD = 0

VX_CFG_L2_NUM_BANKS = "expr: pow(2, clog2(min($VX_CFG_L2_NUM_REQS, 16)))"
# On at every bank count: unlike the dcache, a 2-bank L2 measured neutral
# (sgemm-mc-nt4 -0.6%, fp16-mc-nt4 +0.1%), and it gains from 4 banks up.
VX_CFG_L2_BANK_HASH = 1
VX_CFG_L2_MEM_PORTS = "expr: min($VX_CFG_L2_NUM_BANKS, $VX_CFG_PLATFORM_MEMORY_NUM_BANKS) if $VX_CFG_L2_ENABLE else min($VX_CFG_L2_NUM_REQS, $VX_CFG_PLATFORM_MEMORY_NUM_BANKS)"

[l3cache]
VX_CFG_L3_SIZE = 2097152
VX_CFG_L3_NUM_WAYS = 8
VX_CFG_L3_WRITEBACK = "expr: int($l3_is_llc)"
VX_CFG_L3_DIRTYBYTES = "expr: $VX_CFG_L3_LAZY_FETCH"
VX_CFG_L3_LAZY_FETCH = "expr: int($VX_CFG_L3_WRITEBACK and $l3_is_llc)"
VX_CFG_L3_REPL_POLICY = "expr: $__cache_repl_fifo"
VX_CFG_L3_MSHR_SIZE = "expr: clamp(pow(2, clog2(($mem_bytes_in_flight + $l3_inflight_bytes - 1) // $l3_inflight_bytes)), 16, 256) if $VX_CFG_L3_ENABLE else 16"
l3_inflight_bytes = "expr: $VX_CFG_L3_NUM_BANKS * $VX_CFG_L3_SECTOR_SIZE"
VX_CFG_L3_LATENCY = "expr: 4 + max(0, clog2($VX_CFG_L3_SIZE) - clog2(2097152))"
VX_CFG_L3_MRSQ_SIZE = 4
VX_CFG_L3_MREQ_SIZE = 0
VX_CFG_L3_CRSQ_SIZE = 0

VX_CFG_L3_NUM_BANKS = "expr: pow(2, clog2(min($VX_CFG_L3_NUM_REQS, 16)))"
VX_CFG_L3_MEM_PORTS = "expr: min($VX_CFG_L3_NUM_BANKS, $VX_CFG_PLATFORM_MEMORY_NUM_BANKS) if $VX_CFG_L3_ENABLE else min($VX_CFG_L3_NUM_REQS, $VX_CFG_PLATFORM_MEMORY_NUM_BANKS)"

[lmem]
lmem_bytes_per_bank = 2048
# Narrow cores must keep a usable shared-memory window: scaling capacity with
# bank count alone drops NT=1 to 2KB, below what CTAs that fit every other
# configuration need. The floor holds a full warp-count group of co-resident
# CTAs: kernels that rendezvous across `NUM_WARPS` CTAs -- the DXA multicast
# pattern -- make no progress at all once fewer than the whole group fits.
lmem_min_bytes = 16384
VX_CFG_LMEM_NUM_BANKS = "expr: $VX_CFG_NUM_LSU_LANES"
VX_CFG_LMEM_LOG_SIZE = "expr: clog2(max($lmem_min_bytes, $VX_CFG_LMEM_NUM_BANKS * $lmem_bytes_per_bank))"
# Capacity in bytes; LMEM_LOG_SIZE is its power-of-two address window, so a
# capacity like 96 KB or 228 KB sets both (LMEM_LOG_SIZE = clog2(LMEM_SIZE)).
VX_CFG_LMEM_SIZE = "expr: pow(2, $VX_CFG_LMEM_LOG_SIZE)"
# Which bank port serves the tensor unit's operand row reads. 0: the DMA port,
# on the banks' read/write port, taken in turn with the DXA's row writes, so a
# byte the DXA stages and the tensor unit reads crosses that port twice. 1: the
# banks' read-only port, which only exists with several LSU blocks
# (NUM_LSU_BLOCKS > 1; the build refuses 1 otherwise) and which the second LSU
# read engine uses: the row reads and the LSU's read passes take the banks in
# turn, so a row read never shares a cycle with a pass's reads and the knob
# adds no read bytes to a clock (the two engines' passes together read up to
# 2 x NUM_LSU_LANES words, one bank row's worth at 16 banks and 8 lanes). A
# row read waits while a write lands in its row or an atomic owns its bank,
# and then stops the first engine until it is served. The DMA
# port then carries the DXA's writes alone. No effect without WGMMA operands.
VX_CFG_LMEM_TCU_RDPORT = 0
# 1: plain-store lanes of one request that write different bytes of one bank
# word (4-byte or narrower elements in XLEN-wide banks) share the word's bank
# access, their byte enables merged, instead of each taking a pass of its own.
# Lanes writing the same bytes still go one pass each, in lane order.
VX_CFG_LMEM_WR_MERGE = 0
# 1: every LSU block's stores have a pass engine of their own, and the engines'
# passes share a cycle whenever they take different banks, so the banks, not the
# single write engine, bound the stores: up to one bank row (LMEM_NUM_BANKS
# words) per cycle from all blocks together. Reads and atomics keep the two
# engines they have, and every store keeps its order against every read. Needs
# several LSU blocks (NUM_LSU_BLOCKS > 1; the build refuses 1).
VX_CFG_LMEM_WR_ROW = 0
# 1: the blocks' store engines take their plain loads too, on the banks'
# read-only port, and the shared read engine is not built: loads and stores
# together get up to one bank row per cycle, and a block's loads and stores
# reach the banks in the order it sent them. No store holds the other blocks'
# loads: an engine with a pass to issue chooses its banks first within
# NUM_LSU_BLOCKS cycles that issue one. Atomics keep the first engine and take
# turns with the plain requests. Needs LMEM_WR_ROW=1 (the build refuses 0).
VX_CFG_LMEM_RD_ROW = 0

[tcu]
# string enum: 'DPI'|'DSP'|'BHF'|'TFR'|'FPNEW'; TFR is the universal default. On
# FPGA its FEDP multipliers map onto DSP48 via VX_CFG_TCU_USE_DSP below.
VX_CFG_TCU_TYPE = "TFR"
VX_CFG_NUM_TCU_LANES = "expr: $VX_CFG_NUM_THREADS"
VX_CFG_NUM_TCU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"
# Map FEDP multipliers onto DSP48: on for FPGA synth, off for ASIC/sim.
VX_CFG_TCU_USE_DSP = "expr: 1 if ($SYNTHESIS and not $ASIC) else 0"
# Block-geometry K (mirrors VX_tcu_pkg's TCU_TC_K derivation).
tcu_tc_k = "expr: 1 << (clog2($VX_CFG_NUM_THREADS) // 2)"
# Per-type FEDP pipeline latency; each FEDP variant asserts the selected
# value against its internal stage structure at elaboration.
tcu_latency_dsp   = "expr: 1 + 8 + clog2(2 * $tcu_tc_k + 1) * 11"
tcu_latency_bhf   = "expr: 4 + clog2(2 * $tcu_tc_k + 1) * 3"
tcu_latency_fpnew = "expr: 14 + clog2(2 * $tcu_tc_k) * 7"
tcu_latency_dpi   = 4
# TFR = mul stages + align + accumulate + round: 5 = 2-stage multiply, the
# hardware build (DSP48 PREG on FPGA, a product register on ASIC);
# 4 = single-cycle multiply used in simulation.
tcu_latency_tfr   = "expr: 5 if ($VIVADO or $QUARTUS or $ASIC) else 4"
VX_CFG_TCU_LATENCY = "expr: $tcu_latency_dsp if $VX_CFG_TCU_TYPE_DSP else ($tcu_latency_bhf if $VX_CFG_TCU_TYPE_BHF else ($tcu_latency_fpnew if $VX_CFG_TCU_TYPE_FPNEW else ($tcu_latency_dpi if $VX_CFG_TCU_TYPE_DPI else $tcu_latency_tfr)))"
# Tensor throughput divider: the FEDP array holds TC_M x TC_N / ratio dot
# products and a micro-op occupies it for `ratio` cycles. A power of two that
# divides TC_M x TC_N (= NUM_THREADS); VX_tcu_core and SimX reject any other.
VX_CFG_TCU_PE_RATIO = 1
VX_CFG_TCU_TF32_ENABLE = false
VX_CFG_TCU_FP16_ENABLE = true
VX_CFG_TCU_FP8_ENABLE = false
VX_CFG_TCU_FP4_ENABLE = false
VX_CFG_TCU_INT8_ENABLE = false
VX_CFG_TCU_INT4_ENABLE = false
VX_CFG_TCU_MX_ENABLE = false
VX_CFG_TCU_MXFP4_ENABLE = false
VX_CFG_TCU_NVFP4_ENABLE = false
VX_CFG_TCU_SPARSE_ENABLE = false
VX_CFG_TCU_DSM_ENABLE = false
VX_CFG_TCU_WGMMA_ENABLE = false
VX_CFG_TCU_FEDP2K = false
# A sparse WGMMA uop fills the doubled-K FEDP with compressed A (wgmma.sp k32
# vs dense k16), so a sparse WGMMA covers twice the dense tile K; without it
# the FEDP's upper half idles on every sparse uop. It applies where a uop can
# read two half-K metadata banks per m-step (WMMA k_steps >= 4: NT 8 and 32);
# elsewhere sparse uops keep the dense tile K.
VX_CFG_TCU_SPARSE_FULLK_ENABLE = "expr: $VX_CFG_TCU_SPARSE_ENABLE and $VX_CFG_TCU_WGMMA_ENABLE and $VX_CFG_TCU_FEDP2K"
# Tensor memory: a per-core accumulator of (TCU blocks x WGMMA M) lanes by
# TMEM_COLS 32-bit columns, written by the TCU's single-thread MMA engine.
VX_CFG_TCU_TMEM_ENABLE = false
VX_CFG_TCU_TMEM_COLS = 128
# N blocks of dense K-major B a tensor op fetches ahead of the one in use; the
# B buffer holds one more block than that. A block's fetch takes 4 cycles to
# its 2 steps, so 1 runs the walk at half rate and 2 runs it back to back.
VX_CFG_TCU_TMEM_B_AHEAD = 1
# 1: a tensor op reads row-major A from shared memory a bank row at a time
# instead of a read per A row.
VX_CFG_TCU_TMEM_A_BANKROW = 0

[dxa]
# Cluster-level DXA engine count, decoupled from cores/socket size.
VX_CFG_NUM_DXA_CORES = "expr: max(1, up($VX_CFG_NUM_CORES / 8))"
VX_CFG_DXA_MEM_PORTS = "expr: min($VX_CFG_NUM_DXA_CORES, up($VX_CFG_NUM_CORES / $VX_CFG_SOCKET_SIZE) * $VX_CFG_L1_MEM_PORTS)"
# Memory ports of a socket's DXA engine toward L2. Port i shares the socket's
# L1 memory port i with the caches, below them in priority, and the engine's
# workers are split evenly over the ports. SimX only: the RTL engine has one.
VX_CFG_DXA_GMEM_PORTS = 1
VX_CFG_DXA_QUEUE_SIZE = 16
VX_CFG_DXA_MAX_INFLIGHT = 8

[rtu]
# RTU (Ray-Tracing Unit)
VX_CFG_NUM_RTU_CORES       = "expr: up($VX_CFG_SOCKET_SIZE / 4)"
VX_CFG_RTU_BVH_WIDTH       = 4    # CW-BVH4
# Flat-walker (BVH_WIDTH=0) TLAS/instancing path. Off by default: the CW-BVH4
# walker descends LEAF_INST natively, so this is only needed in a flat (WIDTH=0)
# build. Made explicit so the ifdef has a defined producer instead of resolving
# to always-false.
VX_CFG_RTU_TLAS_ENABLE     = false
VX_CFG_RTU_STACK_DEPTH     = 16   # short-stack depth per context
VX_CFG_RTU_RECIP_DSP_SEED  = 0    # inv_d reciprocal backend: 0=LUT-NR, 1=BRAM seed + DSP Newton-Raphson
# Map the geometry-PE F32 FMAs/FDIVs onto the hardened vendor FP IP: on for FPGA
# synth, off for ASIC/sim (mirrors VX_CFG_FPU_USE_DSP).
VX_CFG_RTU_USE_DSP         = "expr: 1 if ($SYNTHESIS and not $ASIC) else 0"
# RTU divide latency. Unlike the flexible-latency soft FMA, VX_fdiv_unit has a FIXED
# depth per backend, so this is BACKEND-keyed like VX_CFG_FMA_LATENCY — NOT FPU-type
# keyed like VX_CFG_FDIV_LATENCY (which would hand the RTL divider the DPI/FPNEW
# model's 15/16 that the RTU never uses). Vendor xil_fdiv=28 on Vivado, altera=15 on
# Quartus, soft VX_fdiv_unit_rtl F32=17 in sim/ASIC. Matches VX_fdiv_unit's own
# USE_VENDOR_IP = USE_DSP(=RTU_USE_DSP) && (VIVADO||QUARTUS).
VX_CFG_RTU_FDIV_LATENCY    = "expr: 28 if $VIVADO else (15 if $QUARTUS else 17)"
# Slot pool: resident traces. A slot stages one vx_rt_wtrace (its rays, its
# control state and its result record) from issue to terminal; a context is one
# ray's live BVH walk. The two are independent axes: slots buy residency,
# contexts buy traversal parallelism. Slots partition statically across the
# cores an RTU serves (CORES_PER_RTU = SOCKET_SIZE / NUM_RTU_CORES), so the
# count must be a whole multiple of that — the expression below is one slot per
# core at every socket size. A kernel that keeps more traces in flight per warp
# than its core owns slots needs a larger pool (see tests/raytracing).
VX_CFG_RTU_NUM_SLOTS       = "expr: $VX_CFG_SOCKET_SIZE / $VX_CFG_NUM_RTU_CORES"
# In-flight ray contexts. DERIVED, not a free knob: a SLOT OWNS ITS CONTEXTS (one per
# thread of the warp it is tracing), so the two cannot be set independently. They used to
# be, and the "extra contexts idle" configuration that allowed was a machine in which
# slots bought residency but never traversal parallelism.
# Raising slots past 1 MEASURES WORSE (rt_raycast, rtlsim: 1 slot 197,404 cy; 2 slots
# +3.7%; 4 slots +28.5%) — more contexts spread a saturated front end across more
# claimants and lengthen every ray's serial chain. Widen the front end before revisiting.
VX_CFG_RTU_NUM_CTX         = "expr: $VX_CFG_RTU_NUM_SLOTS * $VX_CFG_NUM_THREADS"
# RTU MSHR file: distinct node fetches the traversal front end may keep in
# flight, and the table that merges duplicate ones. Near the BVH root every
# context wants the same node, so one entry can serve many. 0 disables merging
# (per-context tags — one request per context per fetch).
VX_CFG_RTU_MERGE_DEPTH     = 0
VX_CFG_NUM_RTU_BLOCKS      = 2    # parallel memory request ports per RtuCore

[tex]
VX_CFG_NUM_TEX_CORES = "expr: max(1, up($VX_CFG_NUM_CORES / 8))"
# Texture memory-level parallelism: the request queue is the hard limit on how
# many texture instructions a core can have in flight, so it must be sized by
# the latency to hide, not by the SIMD-group count (which was 1 in every
# graphics config, capping the unit at 2 outstanding requests).
VX_CFG_TEX_REQ_QUEUE_SIZE = "expr: max(8, 2 * up($VX_CFG_NUM_THREADS / $VX_CFG_NUM_SFU_LANES))"
VX_CFG_TEX_MEM_QUEUE_SIZE = "expr: $VX_CFG_TEX_REQ_QUEUE_SIZE"

[raster]
VX_CFG_NUM_RASTER_CORES       = "expr: max(1, up($VX_CFG_NUM_CORES / 16))"
VX_CFG_RASTER_NUM_SLICES      = 1
VX_CFG_RASTER_TILE_LOG_SIZE    = 5
# Coarse bin: on-device binning groups prims into 128 px bins and
# the RASTER front end descends bin -> block -> quad, re-evaluating edges. Far
# fewer coverage entries than 32 px tiles; identical pixel coverage.
VX_CFG_RASTER_BIN_LOG_SIZE     = 7
VX_CFG_RASTER_BLOCK_LOG_SIZE   = 2
VX_CFG_RASTER_MEM_FIFO_DEPTH  = 8
VX_CFG_RASTER_QUAD_FIFO_DEPTH = 32
VX_CFG_RASTER_MEM_QUEUE_SIZE  = 4
# Early-Z occlusion cull: on wherever it is legal. It reads committed depth
# through the OM's ocache, so it needs both units (VX_define.vh enforces it).
VX_CFG_RASTER_EARLYZ_ENABLE   = "expr: $VX_CFG_EXT_RASTER_ENABLE and $VX_CFG_EXT_OM_ENABLE"

[om]
VX_CFG_NUM_OM_CORES       = "expr: max(1, up($VX_CFG_NUM_CORES / 8))"
VX_CFG_OM_MEM_QUEUE_SIZE  = 4

[tcache]
VX_CFG_TCACHE_SIZE      = 8192
VX_CFG_TCACHE_NUM_BANKS = 1
VX_CFG_TCACHE_NUM_WAYS  = 2
VX_CFG_TCACHE_CRSQ_SIZE = 0
VX_CFG_TCACHE_MSHR_SIZE = 16
VX_CFG_TCACHE_MRSQ_SIZE = 0
VX_CFG_TCACHE_MREQ_SIZE = 0
VX_CFG_NUM_TCACHES      = "expr: max(1, up($VX_CFG_NUM_TEX_CORES / 4))"

[rcache]
VX_CFG_RCACHE_SIZE      = 4096
VX_CFG_RCACHE_NUM_BANKS = 1
VX_CFG_RCACHE_NUM_WAYS  = 2
VX_CFG_RCACHE_CRSQ_SIZE = 0
VX_CFG_RCACHE_MSHR_SIZE = 16
VX_CFG_RCACHE_MRSQ_SIZE = 0
VX_CFG_RCACHE_MREQ_SIZE = 0
VX_CFG_NUM_RCACHES      = "expr: max(1, up($VX_CFG_NUM_RASTER_CORES / 4))"

[rtcache]
# RTU-private L1 BVH/scene cache. Mirrors the rcache shape
# (raster cache) — RtuCore goes direct to L2 today; this cache sits
# between them so cross-ray reuse of the same BVH nodes (root,
# upper-level internals) hits in L1 instead of thrashing L2.
# Sized larger than rcache because BVH walks touch many more lines
# per ray (root + a couple internals + leaf + tri data ≈ 5-8 lines
# per primary ray; secondary rays reuse the upper-level set).
VX_CFG_RTCACHE_SIZE      = 8192
VX_CFG_RTCACHE_NUM_BANKS = 1
VX_CFG_RTCACHE_NUM_WAYS  = 2
VX_CFG_RTCACHE_CRSQ_SIZE = 2
VX_CFG_RTCACHE_MSHR_SIZE = 16
VX_CFG_RTCACHE_MREQ_SIZE = 4
VX_CFG_RTCACHE_MRSQ_SIZE = 0
VX_CFG_NUM_RTCACHES      = "expr: max(1, up($VX_CFG_NUM_RTU_CORES / 4))"

[ocache]
VX_CFG_OCACHE_SIZE      = 16384
VX_CFG_OCACHE_NUM_BANKS = 1
VX_CFG_OCACHE_NUM_WAYS  = 2
VX_CFG_OCACHE_CRSQ_SIZE = 0
VX_CFG_OCACHE_MSHR_SIZE = 16
VX_CFG_OCACHE_MRSQ_SIZE = 0
VX_CFG_OCACHE_MREQ_SIZE = 0
VX_CFG_NUM_OCACHES      = "expr: max(1, up($VX_CFG_NUM_OM_CORES / 4))"

[isa_signatures]

# Standard extension signature
VX_CFG_MISA_STD = "expr: ($VX_CFG_EXT_A_ENABLED << 0) | (0 << 1) | ($VX_CFG_EXT_C_ENABLED << 2) | ($VX_CFG_EXT_D_ENABLED << 3) | (0 << 4) | ($VX_CFG_EXT_F_ENABLED << 5) | (0 << 6) | (0 << 7) | (1 << 8) | (0 << 9) | (0 << 10) | (0 << 11) | ($VX_CFG_EXT_M_ENABLED << 12) | (0 << 13) | (0 << 14) | (0 << 15) | (0 << 16) | (0 << 17) | (0 << 18) | (0 << 19) | (1 << 20) | (0 << 21) | (0 << 22) | (1 << 23) | (0 << 24) | (0 << 25)"

# Custom extensions signature
VX_CFG_MISA_EXT = "expr: ($VX_CFG_ICACHE_ENABLED << 0) | ($VX_CFG_DCACHE_ENABLED << 1) | ($VX_CFG_L2_ENABLED << 2) | ($VX_CFG_L3_ENABLED << 3) | ($VX_CFG_LMEM_ENABLED << 4) | ($VX_CFG_EXT_ZICOND_ENABLED << 5) | ($VX_CFG_EXT_TCU_ENABLED << 9) | ($VX_CFG_EXT_DXA_ENABLED << 10) | ($VX_CFG_EXT_TEX_ENABLED << 6) | ($VX_CFG_EXT_RASTER_ENABLED << 7) | ($VX_CFG_EXT_OM_ENABLED << 8) | ($VX_CFG_EXT_RTU_ENABLED << 11) | ($VX_CFG_EXT_TFU_ENABLED << 12) | ($VX_CFG_EXT_ZFHMIN_ENABLED << 13) | ($VX_CFG_EXT_LDST_WIDE_ENABLED << 14) | ($VX_CFG_EXT_LDST_MATRIX_ENABLED << 15)"

[toolchain]
ASIC = false
SYNTHESIS = false
VIVADO = false
QUARTUS = false
YOSYS = false
SYNOPSYS = false
SV_DPI = false

[debug]
VX_DBG_STALL_TIMEOUT = "expr: (100000 * (1 << ($VX_CFG_L2_ENABLED + $VX_CFG_L3_ENABLED)))"
VX_DBG_DEBUG_LEVEL = 3

[[enum]]
VX_CFG_XLEN = [32, 64]
VX_CFG_FLEN = [32, 64]
VX_CFG_FPU_TYPE = ["DPI", "DSP", "FPNEW", "STD"]
VX_CFG_TCU_TYPE = ["DPI", "DSP", "BHF", "TFR", "FPNEW"]
VX_CFG_PLATFORM_MEMORY_TYPE = ["HBM2", "HBM3", "HBM3E", "GDDR6"]

[[param]]
VX_CFG_DCACHE_NUM_REQS = "int"
VX_CFG_L2_NUM_REQS = "int"
VX_CFG_L3_NUM_REQS = "int"

[[builtin]]
__FILE__ = "string"
__LINE__ = "int"
