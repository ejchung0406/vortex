# Core-pipeline suite: the general GPU pipeline (no extensions), gated by both
# cross-cutting checks. Merged from the former model_parity.yaml + perf_gate.yaml
# — neither was a suite: `model_parity` and `perf_gate` are CHECKS, carried as a
# marker by cases in every category file (tensor*, graphics, dxa, raytracing).
# A file is named after the suite it holds, never after a check that asserts on it.
#
# The two checks share these workloads deliberately — they are sized so steady
# state dominates (>=~300k cycles), so the cycle number is real execution rather
# than boot/dispatch skew:
#
#   check: model_parity  runs the SAME app/args/configs on BOTH drivers and
#     asserts (a) retired instructions match EXACTLY (a mismatch is functional
#     divergence, never tolerance-gated) and (b) cycle counts agree within
#     `tolerance:` (default 5%). SimX is the timing model of the RTL, not just a
#     functional oracle.
#
#   check: perf_gate     pins to rtlsim (HW-truth cycles) and asserts THIS
#     commit's cycles against a checked-in golden baseline
#     (ci/baselines/perf/core.json — named after the `category:` below) within
#     +/-2%. Baselines are regenerated only by
#     `pytest ci -m perf_gate --update-baselines`, human-reviewed via the JSON
#     diff, and never written by CI.
#
# A case carries exactly ONE check, so the parity and perf views of the same
# workload are separate cases: the perf ids are bare (`sgemm`) because the golden
# baseline is keyed by them (`core:sgemm:rtlsim`); the parity twins are prefixed
# `parity-`. Perf cases additionally pin NUM_THREADS, so the gate measures a
# fixed SIMD width rather than whatever the default happens to be.
#
# `tolerance:` (a fraction in (0,1)) widens a single parity case's cycle gap;
# `defaults.tolerance:` moves it for the file. Only widen it for a case whose
# SimX model genuinely cannot track the RTL to 5% — document why — never to paper
# over a regression.
#
# See docs/designs/continuous_integration.md §3.3 (parity) and §3.4 (perf).
category: core
defaults:
  # 32-bit by default: the SimX timing model and the perf baselines are
  # validated against RV32 rtlsim. A check case runs at XLEN 32 unless it names
  # its own xlen, and is then gated at exactly that xlen.
  xlen:
  - 32
  tier: full
  # Any core-model or RTL change can move cycles.
  touches:
  - sim/simx/
  - hw/rtl/
tests:

# ---------------------------------------------------------------------------
# check: perf_gate — rtlsim cycles vs. ci/baselines/perf/core.json
#
# Each workload is swept over both SIMD widths via `shape.threads: [4, 16]`, so
# the planner emits an -nt4 and an -nt16 case per app and a change that only
# hurts wide-SIMD execution (LSU coalescing, cache bank conflicts, operand
# collection) cannot land green. NUM_WARPS stays at its default so the sweep
# isolates SIMD width from multi-warp latency hiding.
# ---------------------------------------------------------------------------

# ALU/LSU/branch streaming pipeline.
- id: vecadd
  check: perf_gate
  via: blackbox
  app: vecadd
  args: -n16384
  shape:
    threads: [4, 16]
# FPU + LSU locality, multi-warp reuse.
- id: sgemm
  check: perf_gate
  via: blackbox
  app: sgemm
  args: -n128
  shape:
    threads: [4, 16]
# Softmax: elementwise exp + reduction (FPU + reduction traffic).
- id: softmax
  check: perf_gate
  via: blackbox
  app: softmax
  args: -n64
  shape:
    threads: [4, 16]
# SGEMV: FPU + streaming matrix-vector.
- id: sgemv
  check: perf_gate
  via: blackbox
  app: sgemv
  args: -m512 -n512
  shape:
    threads: [4, 16]
# SGEMM multi-core: NW=8 across 2 cores (shared L2 — multi-core needs it).
- id: sgemm-mc
  check: perf_gate
  via: blackbox
  app: sgemm
  args: -n128
  configs: -DVX_CFG_NUM_WARPS=8
  shape: {cores: 2, l2cache: true, threads: [4, 16]}
# SGEMM with local-memory tiling (kernel-managed shared memory).
- id: sgemmx
  check: perf_gate
  via: blackbox
  app: sgemmx
  args: -n128
  shape:
    threads: [4, 16]
# 3D stencil: neighbor-heavy strided LSU traffic + FPU. n32 keeps the rtlsim
# run steady-state-sized (n64 is ~35M cycles, too heavy for the full tier).
- id: stencil3d
  check: perf_gate
  via: blackbox
  app: stencil3d
  args: -n32
  shape:
    threads: [4, 16]
# Software raycaster: divergent control flow + mixed ALU/FPU.
- id: raycast
  check: perf_gate
  via: blackbox
  app: raycast
  shape:
    threads: [4, 16]

# ---------------------------------------------------------------------------
# check: model_parity — SimX vs rtlsim, same app/args/configs on both drivers
# ---------------------------------------------------------------------------

# ALU/LSU/branch streaming pipeline (~314k cycles on the default 1-core shape).
- id: parity-vecadd
  check: model_parity
  via: blackbox
  app: vecadd
  args: -n16384
# Streaming stores into a lazy-fetch write-back L2: store misses allocate
# through the bank loopback instead of a memory fill.
- id: parity-vecadd-lazy-l2
  check: model_parity
  via: blackbox
  app: vecadd
  args: -n16384
  configs: -DVX_CFG_L2_LAZY_FETCH=1
  shape: {l2cache: true}
# Lazy-fetch refetch paths on the default write-back dcache: partial-sector
# loads park and refetch, and same-set thrash evicts lines mid-refetch.
- id: parity-lazy-fetch
  check: model_parity
  via: blackbox
  app: lazy_fetch
  configs: -DVX_CFG_DCACHE_LAZY_FETCH=1
# Fully written sectors on a lazy-fetch write-back L2 shared by 4 cores:
# partial-miss loads and parked chain heads refetch them through the loopback.
- id: parity-lazy-fetch-full
  check: model_parity
  via: blackbox
  app: lazy_fetch
  args: -f -n1
  configs: -DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=1 -DVX_CFG_L2_WRITEBACK=1 -DVX_CFG_L2_LAZY_FETCH=1
  flags: --perf=7
  shape:
    cores: 4
    l2cache: true
# FPU + LSU locality, multi-warp reuse (~1.29M cycles on the default shape).
- id: parity-sgemm
  check: model_parity
  via: blackbox
  app: sgemm
  args: -n64
# Softmax: elementwise exp + reduction (FPU + reduction traffic).
- id: parity-softmax
  check: model_parity
  via: blackbox
  app: softmax
  args: -n64
# SGEMV: FPU + streaming matrix-vector.
- id: parity-sgemv
  check: model_parity
  via: blackbox
  app: sgemv
  args: -m512 -n512
# SGEMM multi-core: NT=NW=8 across 2 cores (shared L2 — multi-core needs it).
- id: parity-sgemm-mc
  check: model_parity
  # Tracks to ~3% since SimX models the contended issue-path serializers
  # (per-fragment load writeback beats, fixed-priority commit arbitration,
  # and the execution units' bounded in-flight windows).
  via: blackbox
  app: sgemm
  args: -n128
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8
  shape: {cores: 2, l2cache: true}
# The same shape at n64: L2 hits on a miss-heavy working set, two operand
# collectors per issue slice, and the load-response path's exact entry counts.
- id: parity-sgemm-mc64
  check: model_parity
  # Tighter than the default: the shape exercises those entries and the
  # collectors' output register exactly.
  tolerance: 0.03
  via: blackbox
  app: sgemm
  args: -n64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8
  shape: {cores: 2, l2cache: true}
# The same shape behind a 20-cycle link to the L2, each way: both cores' L2
# traffic, its fills and its back-pressure cross the link's delay buffers.
- id: parity-sgemm-mc64-l2link
  check: model_parity
  via: blackbox
  app: sgemm
  args: -n64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_L2_LINK_LATENCY=20
  shape: {cores: 2, l2cache: true}
# L2-hit load-to-use latency through the link: a pointer chase that misses the
# dcache and hits the L2, one dependent load at a time.
- id: parity-chase-l2link
  check: model_parity
  via: blackbox
  app: chase
  args: -b262144 -w1 -i512
  configs: -DVX_CFG_L2_LINK_LATENCY=20
  shape: {l2cache: true}
# Two dependent lines per set fit in a three-way L2. They must stay resident
# even when fill forwarding bypasses the replay lookup.
- id: parity-chase-l2-plru
  check: model_parity
  via: blackbox
  app: chase
  xlen: [64]
  args: -b512 -w1 -i512
  configs: >-
    -DVX_CFG_DCACHE_DISABLE -DVX_CFG_L2_NUM_BANKS=1 -DVX_CFG_L2_NUM_WAYS=3
    -DVX_CFG_L2_SIZE=768 -DVX_CFG_L2_REPL_POLICY=2 -DVX_CFG_PLATFORM_MEMORY_LATENCY=100
  shape: {l2cache: true}
# L2-hit latency through an SM group's switch in place of the private link:
# the switch's cycle each way.
- id: parity-chase-noc
  check: model_parity
  xlen: [64]
  via: blackbox
  app: chase
  args: -b262144 -w1 -i512
  configs: -DVX_CFG_L2_LINK_LATENCY=20 -DVX_CFG_NOC_GROUP_SIZE=1 -DVX_CFG_NOC_UPLINK_PORTS=2
  shape: {l2cache: true}
# The device PTW remains an L2 client outside the grouped socket ports.
- id: parity-chase-noc-ptw
  check: model_parity
  xlen: [64]
  via: blackbox
  app: chase
  args: -b262144 -w1 -i512
  configs: -DVX_CFG_VM_ENABLE -DVX_CFG_DCACHE_NUM_BANKS=1 -DVX_CFG_NOC_GROUP_SIZE=2 -DVX_CFG_NOC_UPLINK_PORTS=2
  shape: {cores: 4, l2cache: true}
# The arbitration state persists through repeated launches.
- id: parity-bwstream-noc-relaunch
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n128 -u4 -g5 -R3
  configs: -DVX_CFG_L2_LINK_LATENCY=20 -DVX_CFG_NOC_GROUP_SIZE=2 -DVX_CFG_NOC_UPLINK_PORTS=2
  shape: {cores: 4, l2cache: true}
# Two groups of four cores with four memory ports each: 16 ports per switch,
# which each lane arbitrates in two registered slices.
- id: parity-bwstream-noc-slices
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n256 -u4 -b4
  configs: -DVX_CFG_DCACHE_NUM_BANKS=4 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=4 -DVX_CFG_L2_LINK_LATENCY=20 -DVX_CFG_NOC_GROUP_SIZE=4 -DVX_CFG_NOC_UPLINK_PORTS=4
  shape: {cores: 8, l2cache: true}
# Four ports per socket give 72 inputs and 128 default uplink lanes.
- id: noc-recursive-fanin
  via: blackbox
  drivers: [simx]
  xlen: [64]
  app: demo
  configs: -DVX_CFG_DCACHE_NUM_BANKS=4 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=4 -DVX_CFG_NOC_GROUP_SIZE=18
  shape: {cores: 18, l2cache: true}
# The same shape behind a 20-cycle link between each core and the dcache, each
# way: both cores' lanes, their stores and the dcache back-pressure cross the
# link's delay buffers, and each core's dcache flush waits for its lanes.
- id: parity-sgemm-mc64-l1link
  check: model_parity
  via: blackbox
  app: sgemm
  args: -n64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_L1_LINK_LATENCY=20
  shape: {cores: 2, l2cache: true}
# L1-hit load-to-use latency through the link: a pointer chase that hits the
# dcache, one dependent load at a time.
- id: parity-chase-l1link
  check: model_parity
  via: blackbox
  app: chase
  args: -b8192 -w1 -i512
  configs: -DVX_CFG_L1_LINK_LATENCY=20
# A launch masked to cores 1 and 3 of two two-core sockets: compute CTAs skip
# the masked cores at the socket fan-out, and the round-robin pointer starts
# on a masked one. -T fails the run if a CTA reports a masked core.
- id: parity-bwstream-coremask
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n1024 -M1,3 -T
  configs: -DVX_CFG_SOCKET_SIZE=2
  shape:
    cores: 4
    l2cache: true
# The same shape with cores 0, 1 and 3: the sockets have two and one enabled
# cores, so the cluster-level round-robin is weighted 2:1 and every enabled
# core gets four CTAs; socket 1's pointer starts on masked core 2. -T fails
# the run if the enabled cores' counts differ by more than one.
- id: parity-bwstream-coremask-uneven
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n1024 -M0,1,3 -T
  configs: -DVX_CFG_SOCKET_SIZE=2
  shape:
    cores: 4
    l2cache: true
# Cores 0, 1 and 2: the weighted socket is the second, and its pointer starts
# on an enabled core.
- id: parity-bwstream-coremask-uneven012
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n1024 -M0,1,2 -T
  configs: -DVX_CFG_SOCKET_SIZE=2
  shape:
    cores: 4
    l2cache: true
# Three launches of ten CTAs on cores 0, 1 and 2: a launch ends part-way into
# a credit window, and the next resumes it, as the round-robin pointers and
# credits are device state. Summed over the launches each core gets ten; a
# model that reset them per launch would give 9, 9, 12, which -T fails.
- id: parity-bwstream-coremask-relaunch
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n256 -g10 -R3 -M0,1,2 -T
  configs: -DVX_CFG_SOCKET_SIZE=2
  shape:
    cores: 4
    l2cache: true
# Two clusters of two two-core sockets, cores 0, 1, 2 and 4: the device level
# is weighted 3:1 and cluster 0's 2:1, so both weighted levels must agree for
# each enabled core to get four CTAs.
- id: parity-bwstream-coremask-uneven-clusters
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream
  args: -n256 -M0,1,2,4 -T
  configs: -DVX_CFG_SOCKET_SIZE=2
  shape:
    clusters: 2
    cores: 4
    l2cache: true
# SGEMM on two frontend slices feeding four issue slices: per-slice fetch on a
# two-port icache, CTAs as wide as the core, a 16-port dcache.
- id: parity-sgemm-fw2
  check: model_parity
  # Tighter than the default: icache port 0, which carries the flush
  # injection, holds four requests, and the shape exercises all of them.
  tolerance: 0.03
  via: blackbox
  app: sgemm
  args: -n128
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_FETCH_WIDTH=2
# Four frontend slices on a four-port icache: every slice but the first fetches
# through two request entries, the first through four.
- id: parity-sgemm-fw4
  check: model_parity
  via: blackbox
  app: sgemm
  args: -n128
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_FETCH_WIDTH=4
# Device printf: per-character IO ring stores, each published behind a fence
# that drains, flushes and invalidates the data cache.
- id: parity-printf
  check: model_parity
  via: blackbox
  app: printf
# The same fences on data caches with more banks than memory ports: every
# port's flush token must be answered on that port.
- id: parity-printf-iw2
  check: model_parity
  via: blackbox
  app: printf
  configs: -DVX_CFG_ISSUE_WIDTH=2
- id: parity-printf-fw2
  check: model_parity
  via: blackbox
  app: printf
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_FETCH_WIDTH=2
# The same fences on a data cache shared by two cores, below an L2: each core's
# token rides its own flush injection, and every fence walks the data cache.
- id: parity-printf-ss2
  check: model_parity
  via: blackbox
  app: printf
  configs: -DVX_CFG_SOCKET_SIZE=2
  shape:
    cores: 2
    l2cache: true
# Same-word reads from several coalescer channels of one warp, served by one
# dcache bank access and returned to every channel.
- id: parity-uniform-ld
  check: model_parity
  via: blackbox
  app: uniform_ld
  configs: -DVX_CFG_NUM_THREADS=16
# More coalescer channels than the lanes' bytes in words (VX_CFG_DCACHE_CHANNELS):
# 8 lanes of 8 bytes on a 64-byte word, in two and in four lane groups. Lanes
# in one, two, three and eight words, with one LSU block and with two; then a
# line-aligned load stream, whose two channels read one word per load.
- id: parity-dcache-ch2-lane-words
  check: model_parity
  xlen: [64]
  via: blackbox
  app: lane_words
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_DCACHE_WORD_SIZE=64 -DVX_CFG_DCACHE_CHANNELS=2
- id: parity-dcache-ch2-lane-words-iw2
  check: model_parity
  xlen: [64]
  via: blackbox
  app: lane_words
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_DCACHE_WORD_SIZE=64 -DVX_CFG_DCACHE_CHANNELS=2 -DVX_CFG_ISSUE_WIDTH=2
- id: parity-dcache-ch4-lane-words
  check: model_parity
  xlen: [64]
  via: blackbox
  app: lane_words
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_DCACHE_WORD_SIZE=64 -DVX_CFG_DCACHE_CHANNELS=4
- id: parity-dcache-ch2-ldstream-line
  check: model_parity
  xlen: [64]
  via: blackbox
  app: ldstream
  args: -t32 -b8 -u4 -m0.125 -l
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_DCACHE_WORD_SIZE=64 -DVX_CFG_DCACHE_CHANNELS=2
# The same line stream at the h200s core's scale, behind the dcache MMU: 64
# warps on four 8-lane LSU blocks keep the dcache's merged responses and its
# response queues busy, and the two channels of a block reach the coalescer
# through the MMU's response lanes, which have no stage of their own.
- id: parity-dcache-ch2-ldstream-vm
  check: model_parity
  xlen: [64]
  via: blackbox
  app: ldstream
  args: -t2048 -b8 -u8 -m4 -a -l
  configs: >-
    -DVX_CFG_NUM_WARPS=64 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_LSU_LANES=8
    -DVX_CFG_NUM_ALU_LANES=16 -DVX_CFG_FETCH_WIDTH=4
    -DVX_CFG_DCACHE_WORD_SIZE=64 -DVX_CFG_DCACHE_CHANNELS=2 -DVX_CFG_DCACHE_NUM_BANKS=4
    -DVX_CFG_DCACHE_SIZE=262144 -DVX_CFG_DCACHE_FWD_HOLD=1 -DVX_CFG_DCACHE_CRSQ_SIZE=16
    -DVX_CFG_DCACHE_MSHR_SIZE=512 -DVX_CFG_LSU_PENDING_SIZE=512 -DVX_CFG_LSU_PENDING_LIMIT=512
    -DVX_CFG_VM_ENABLE -DVX_CFG_DTLB_SIZE=256 -DVX_CFG_L2_TLB_MEGA_SIZE=256
    -DVX_CFG_LANE_DISPATCH_GAPLESS=3 -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1
    -DVX_CFG_BRANCH_REG=0 -DVX_CFG_FETCH_REQ_BUF=0 -DVX_CFG_FLUSH_REQ_BUF=0 -DVX_CFG_OPC_MERGE_BUF=0
    -DVX_CFG_NUM_GPR_BANKS=8 -DVX_CFG_DISPATCH_QUEUE_SIZE=8 -DVX_CFG_FPU_QUEUE_SIZE=16
    -DVX_CFG_BAR_DRAIN_SCOPE=1
    -DVX_CFG_L2_ENABLE -DVX_CFG_L2_LINK_LATENCY=94 -DVX_CFG_L2_LINE_SIZE=128 -DVX_CFG_L2_NUM_BANKS=16
    -DVX_CFG_L2_MSHR_SIZE=256 -DVX_CFG_L2_SIZE=2097152 -DVX_CFG_L2_REPL_POLICY=2
    -DVX_CFG_PLATFORM_MEMORY_TYPE=HBM3E -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=16
    -DVX_CFG_PLATFORM_MEMORY_DATA_RATE=6250 -DVX_CFG_PLATFORM_MEMORY_PEAK_BW=800000
    -DVX_CFG_PLATFORM_MEMORY_BANK_GROUPS=8 -DVX_CFG_PLATFORM_MEMORY_SCHED_WINDOW=256
    -DVX_CFG_PLATFORM_MEMORY_INTERLEAVE_SIZE=1024 -DVX_CFG_PLATFORM_CLOCK_RATE=1980
  env:
    VORTEX_VM_MEGAPAGE_HEAP: 1
# Warp-wide local memory: broadcast reads, bank-conflict replays, sub-word and
# same-word stores, with one LSU block and with two, where the read engine
# works the banks' second port.
- id: parity-lmem-access
  check: model_parity
  via: blackbox
  app: lmem_access
  configs: -DVX_CFG_NUM_THREADS=16
- id: parity-lmem-access-iw2
  check: model_parity
  via: blackbox
  app: lmem_access
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_ISSUE_WIDTH=2
# -s leaves out the LR/SC phase, whose retry count depends on timing; the
# lmem-access-amo* regression cases run it.
- id: parity-lmem-access-amo-iw2
  check: model_parity
  via: blackbox
  app: lmem_access
  args: -n16 -s
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_EXT_A_ENABLE -DVX_CFG_ISSUE_WIDTH=2
# Store lanes that write different bytes of one bank word share its access
# (VX_CFG_LMEM_WR_MERGE), and each LSU block's stores have a pass engine of
# their own, the engines sharing a cycle on different banks
# (VX_CFG_LMEM_WR_ROW): stores of every size whose lanes meet in one word,
# then streams of 4-byte-spaced and word-spaced stores from every warp.
- id: parity-lmem-wr-merge
  check: model_parity
  xlen: [64]
  via: blackbox
  app: lmem_wr_merge
  args: -w4
  configs: -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=16 -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_LMEM_WR_MERGE=1
- id: parity-lmem-wr-row
  check: model_parity
  xlen: [64]
  via: blackbox
  app: lmem_wr_merge
  args: -w4
  configs: -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=16 -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_LMEM_WR_ROW=1
- id: parity-lmem-wr-merge-row
  check: model_parity
  xlen: [64]
  via: blackbox
  app: lmem_wr_merge
  args: -w8
  configs: -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_LMEM_WR_MERGE=1 -DVX_CFG_LMEM_WR_ROW=1
- id: parity-smem-rate-sts4-merge-row
  check: model_parity
  xlen: [64]
  via: blackbox
  app: smem_rate
  args: -k13 -w8 -i16
  configs: -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_LMEM_WR_MERGE=1 -DVX_CFG_LMEM_WR_ROW=1
- id: parity-smem-rate-sts-row
  check: model_parity
  xlen: [64]
  via: blackbox
  app: smem_rate
  args: -k11 -w8 -i16
