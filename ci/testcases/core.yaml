  configs: -DVX_CFG_NUM_WARPS=4 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_LSU_LANES=8 -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1
- id: parity-warp-rate-lsu-lanes-load
  check: model_parity
  tolerance: 0.01
  via: blackbox
  app: warp_rate
  xlen: [64]
  args: -k12 -w1 -i32
  configs: -DVX_CFG_NUM_WARPS=4 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_LSU_LANES=8 -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1
# The same stores and unread loads with the LSU's empty cycle removed
# (VX_CFG_LANE_DISPATCH_GAPLESS bit 1): four packets per op, back to back.
- id: parity-warp-rate-lsu-lanes-store-gapless
  check: model_parity
  tolerance: 0.005
  via: blackbox
  app: warp_rate
  xlen: [64]
  args: -k11 -w1 -i32
  configs: -DVX_CFG_NUM_WARPS=4 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_LSU_LANES=8 -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1 -DVX_CFG_LANE_DISPATCH_GAPLESS=2
- id: parity-warp-rate-lsu-lanes-load-gapless
  check: model_parity
  tolerance: 0.005
  via: blackbox
  app: warp_rate
  xlen: [64]
  args: -k12 -w1 -i32
  configs: -DVX_CFG_NUM_WARPS=4 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_LSU_LANES=8 -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1 -DVX_CFG_LANE_DISPATCH_GAPLESS=2
# Slow memory lets dependent loads fill every warp's instruction buffer.
- id: parity-bwstream-fetch-credit
  check: model_parity
  tolerance: 0.005
  via: blackbox
  app: bwstream
  xlen: [64]
  args: -n256 -u4 -b32
  configs: >-
    -DVX_CFG_NUM_WARPS=32 -DVX_CFG_NUM_THREADS=4 -DVX_CFG_ISSUE_WIDTH=4
    -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1
    -DVX_CFG_PLATFORM_MEMORY_LATENCY=300
# SGEMM with local-memory tiling (kernel-managed shared memory).
- id: parity-sgemmx
  check: model_parity
  via: blackbox
  app: sgemmx
  args: -n128
# 3D stencil: neighbor-heavy strided LSU traffic + FPU.
- id: parity-stencil3d
  check: model_parity
  via: blackbox
  app: stencil3d
  args: -n32
# Software raycaster: divergent control flow + mixed ALU/FPU.
- id: parity-raycast
  check: model_parity
  via: blackbox
  app: raycast
# Same raycaster at full warp width: spills and call frames exercise the
# interleaved stack window with 16 threads per access.
- id: parity-raycast-nt16
  check: model_parity
  via: blackbox
  app: raycast
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=16
# The raycaster on four cores sharing an L2: its image columns carry very
# different work, so where the launch places each CTA sets the critical path.
- id: parity-raycast-mc
  check: model_parity
  via: blackbox
  app: raycast
  shape:
    cores: 4
    l2cache: true
