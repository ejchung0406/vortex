# WGMMA cases pin one execution block per unit: the default (one block per
# issue slot) multiplies the model size, and a hosted CI runner cannot build it
# in a job. simx and rtlsim legs carry the same pin so both model one machine.
- id: sgemm_tcu_wg_dxa-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg_dxa
  configs: -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  shape:
    threads: 32
    warps: 8
- id: sgemm_tcu_wg_dxa-2
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_wg_dxa
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16 -DVX_CFG_TCU_TYPE=DPI -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_FETCH_WIDTH=2
  shape:
    threads: 32
    warps: 8
# Doubled-K FEDP: the DXA block-major producer must follow the consumer's
# block K extent, which the descriptor conveys explicitly.
- id: sgemm_tcu_wg_dxa-fedp2k
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm_tcu_wg_dxa
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_FEDP2K -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=8 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  shape:
    threads: 8
    warps: 8
# A 128 KB local memory with the tiles placed above 64 KB: the DXA writes and
# both WGMMA shared-memory descriptors address the upper half.
- id: sgemm_tcu_wg_dxa-lmem128k
