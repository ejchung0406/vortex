    -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  shape:
    threads: 32
    warps: 8
- id: dxa_kmajor_check-1
  via: blackbox
  drivers:
  - simx
  app: dxa_kmajor_check
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: dxa_kmajor_check-2
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_kmajor_check
  configs: -DVX_CFG_EXT_DXA_ENABLE
# Concurrent copies at mixed alignments into 128-byte bank rows (16 banks at
# XLEN 64), checked byte by byte: with the engine at two lines per cycle
# (DXA_GMEM_PORTS=2 on two socket memory ports, DXA_LMEM_ROW,
# DXA_LINE_PER_CYCLE) two workers' lines share a row write and a line that
# straddles two row parts goes alone; without, the same copies one half-row
# beat at a time.
- id: dxa_rowmix-row
  via: blackbox
  xlen: [64]
  drivers:
  - simx
  - rtlsim
  app: dxa_rowmix
  args: -x8 -r3 -g4
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_NUM_BANKS=16 -DVX_CFG_DCACHE_NUM_BANKS=2 -DVX_CFG_NUM_DXA_CORES=4
    -DVX_CFG_DXA_GMEM_PORTS=2 -DVX_CFG_DXA_LMEM_ROW=1 -DVX_CFG_DXA_LINE_PER_CYCLE=1
- id: dxa_rowmix-base
  via: blackbox
  xlen: [64]
  drivers:
  - simx
  - rtlsim
  app: dxa_rowmix
  args: -x8 -r3 -g4
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_NUM_BANKS=16

# SimX<->rtlsim cycle parity on the DXA engine: same config on both drivers,
# cycles must agree within tolerance (see core.yaml).
- id: model_parity-copy
  check: model_parity
  # Retired instructions match exactly and the cycle gap is now within tolerance
  # (~4.8%): the SimX LSU decoupled-pending-pool timing closed the former ~9% gap.
  via: blackbox
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d1

# The engine at two lines per cycle (see dxa_rowmix-row): copies that pair
# two workers' lines into one row write, and lines that go alone.
- id: model_parity-rowmix-row
  check: model_parity
  via: blackbox
  xlen: [64]
  app: dxa_rowmix
  args: -x8 -r16 -g8
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_NUM_BANKS=16 -DVX_CFG_DCACHE_NUM_BANKS=2 -DVX_CFG_NUM_DXA_CORES=4
    -DVX_CFG_DXA_GMEM_PORTS=2 -DVX_CFG_DXA_LMEM_ROW=1 -DVX_CFG_DXA_LINE_PER_CYCLE=1

# Two DXA request ports on a wide core.
- id: model_parity-bwstream-dxa-ports
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream_dxa
  args: -e256 -n16 -d4 -c0
  flags: --perf=7
  configs: -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4
    -DVX_CFG_NUM_ALU_LANES=16 -DVX_CFG_NUM_FPU_LANES=32 -DVX_CFG_NUM_LSU_LANES=8
    -DVX_CFG_EXT_TFU_ENABLE -DVX_CFG_NUM_TFU_LANES=16 -DVX_CFG_FDIV_PE_RATIO=8
    -DVX_CFG_FSQRT_PE_RATIO=8 -DVX_CFG_FCVT_PE_RATIO=8 -DVX_CFG_FMA64_PE_RATIO=2
    -DVX_CFG_NUM_GPR_BANKS=8 -DVX_CFG_DISPATCH_QUEUE_SIZE=8 -DVX_CFG_FPU_QUEUE_SIZE=16
    -DVX_CFG_DCACHE_NUM_BANKS=4 -DVX_CFG_LMEM_NUM_BANKS=16 -DVX_CFG_FETCH_INFLIGHT=4
    -DVX_CFG_FFLAGS_ACCUM=1 -DVX_CFG_BRANCH_REG=0 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=4
    -DVX_CFG_L2_ENABLE -DVX_CFG_L2_LINK_LATENCY=20 -DVX_CFG_EXT_DXA_ENABLE
    -DVX_CFG_NUM_DXA_CORES=2 -DVX_CFG_DXA_GMEM_PORTS=2
  shape: {cores: 4}

# Four simultaneous copying CTAs and four load CTAs share the same sockets.
- id: model_parity-dxa-corun
  check: model_parity
  xlen: [64]
  via: blackbox
  app: dxa_corun
  args: -e256 -n16 -d4 -c0 -x4 -L4 -s256
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_THREADS=32 -DVX_CFG_NUM_WARPS=8
    -DVX_CFG_DCACHE_NUM_BANKS=4 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=4
    -DVX_CFG_NUM_DXA_CORES=2 -DVX_CFG_DXA_GMEM_PORTS=2
    -DVX_CFG_L2_LINK_LATENCY=20
  shape: {cores: 4, l2cache: true}

- id: model_parity-bwstream-dxa-group
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream_dxa
  args: -e256 -n16 -d4 -c0
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_THREADS=32 -DVX_CFG_NUM_WARPS=8
    -DVX_CFG_DCACHE_NUM_BANKS=4 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=4
    -DVX_CFG_NUM_DXA_CORES=2 -DVX_CFG_DXA_GMEM_PORTS=2 -DVX_CFG_L2_LINK_LATENCY=20
    -DVX_CFG_NOC_GROUP_SIZE=2 -DVX_CFG_NOC_UPLINK_PORTS=4
  shape: {cores: 4, l2cache: true}

# Two DXA transfers start at opposite half-row offsets. LSU probes their
# rows and a disjoint row, while stores/atomics touch a DMA row's other half
# and a disjoint row, and TMEM copies the whole window.
- id: model_parity-lmem-dma-rd-overlap
  check: model_parity
  via: blackbox
  xlen: [64]
  app: lmem_dma_rd
  touches: [hw/rtl/mem, sim/simx/mem, hw/rtl/dxa, sim/simx/dxa, tests/regression/lmem_dma_rd]
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE
    -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_TMEM_B_AHEAD=2 -DVX_CFG_TCU_TMEM_A_BANKROW=1
    -DVX_CFG_TCU_TYPE=DPI -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=2 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_A_ENABLE
    -DVX_CFG_LMEM_NUM_BANKS=16 -DVX_CFG_LMEM_TCU_RDPORT=1 -DVX_CFG_LMEM_WR_MERGE=1 -DVX_CFG_LMEM_WR_ROW=1 -DVX_CFG_LMEM_RD_ROW=1
    -DVX_CFG_DCACHE_NUM_BANKS=2 -DVX_CFG_NUM_DXA_CORES=4 -DVX_CFG_DXA_GMEM_PORTS=2 -DVX_CFG_DXA_LMEM_ROW=1 -DVX_CFG_LMEM_DMA_RD_OVERLAP=1

# Seven resident copy CTAs share two DXA response ports. Sustained SRAM
# contention exercises a held port head while another worker can capture.
- id: model_parity-bwstream-dxa-shared-response
  check: model_parity
  xlen: [64]
  via: blackbox
  app: bwstream_dxa
  args: -e4096 -n32 -d2 -c0
  flags: --perf=16
  touches: [hw/rtl/dxa, hw/rtl/mem, sim/simx/dxa, sim/simx/mem, tests/regression/bwstream_dxa]
  parity_counters: {prefix: dxa, exact: [transfers, gmem_reads, lmem_writes]}
  configs: >-
    -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_ALU_LANES=16
    -DVX_CFG_NUM_FPU_LANES=8 -DVX_CFG_NUM_LSU_LANES=8 -DVX_CFG_DCACHE_SIZE=65536 -DVX_CFG_FETCH_WIDTH=4
    -DVX_CFG_LMEM_LOG_SIZE=18 -DVX_CFG_LMEM_SIZE=233472 -DVX_CFG_LMEM_NUM_BANKS=16 -DVX_CFG_EXT_DXA_ENABLE
    -DVX_CFG_NUM_BARRIERS=16 -DVX_CFG_FDIV_PE_RATIO=8 -DVX_CFG_FSQRT_PE_RATIO=8 -DVX_CFG_FCVT_PE_RATIO=8
    -DVX_CFG_FMA64_PE_RATIO=2 -DVX_CFG_DCACHE_NUM_BANKS=4 -DVX_CFG_NUM_CLUSTERS=1 -DVX_CFG_L2_ENABLE
    -DVX_CFG_L2_SIZE=4194304 -DVX_CFG_L2_NUM_WAYS=8 -DVX_CFG_L2_NUM_BANKS=16 -DVX_CFG_CP_LLC_CLIENT=1
    -DVX_CFG_L2_LINK_LATENCY=94 -DVX_CFG_L2_MSHR_SIZE=64 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=16
    -DVX_CFG_PLATFORM_CLOCK_RATE=1980 -DVX_CFG_PLATFORM_MEMORY_PEAK_BW=800000
    -DVX_CFG_PLATFORM_MEMORY_TYPE=HBM3E -DVX_CFG_PLATFORM_MEMORY_DATA_RATE=6250
    -DVX_CFG_PLATFORM_MEMORY_LATENCY=304 -DVX_CFG_DCACHE_MSHR_SIZE=64 -DVX_CFG_LSU_PENDING_LIMIT=64
    -DVX_CFG_DTLB_SIZE=256 -DVX_CFG_FPU_QUEUE_SIZE=8 -DVX_CFG_DISPATCH_QUEUE_SIZE=8 -DVX_CFG_NUM_GPR_BANKS=8
    -DVX_CFG_NUM_DXA_CORES=16 -DVX_CFG_DXA_MAX_INFLIGHT=128 -DVX_CFG_DXA_GMEM_PORTS=2 -DVX_CFG_DXA_LMEM_ROW=1
    -DVX_CFG_LSU_PENDING_SIZE=64 -DVX_CFG_DCACHE_WORD_SIZE=64
    -DVX_CFG_DCACHE_CHANNELS=2 -DVX_CFG_DCACHE_CRSQ_SIZE=16 -DVX_CFG_BAR_DRAIN_SCOPE=1
    -DVX_CFG_FETCH_INFLIGHT=4 -DVX_CFG_FFLAGS_ACCUM=1 -DVX_CFG_BRANCH_REG=0 -DVX_CFG_FETCH_REQ_BUF=0
    -DVX_CFG_FLUSH_REQ_BUF=0 -DVX_CFG_OPC_MERGE_BUF=0 -DVX_CFG_LANE_DISPATCH_GAPLESS=3
    -DVX_CFG_LMEM_WR_MERGE=1 -DVX_CFG_LMEM_WR_ROW=1 -DVX_CFG_LMEM_RD_ROW=1 -DVX_CFG_L2_REPL_POLICY=2
    -DVX_CFG_L2_TLB_MEGA_SIZE=256 -DVX_CFG_PLATFORM_MEMORY_BANK_GROUPS=8
    -DVX_CFG_PLATFORM_MEMORY_SCHED_WINDOW=256 -DVX_CFG_PLATFORM_MEMORY_INTERLEAVE_SIZE=1024
    -DVX_CFG_FPU_TYPE=DPI -DVX_CFG_LMEM_DMA_RD_OVERLAP=1 -DVX_CFG_DXA_LINE_PER_CYCLE=1
  shape: {cores: 1}

# Perf-regression twin of the model_parity-copy benchmark (same run, cycles-vs-baseline).
- id: perf_gate-copy
  check: perf_gate
  via: blackbox
  app: dxa_copy
  args: -d1
  configs: -DVX_CFG_EXT_DXA_ENABLE
# Multicast DXA copy: intra-core multicast handshake microbench (work is
# num_recv x tile by design; rtlsim determinism makes the small run gateable).
# Parity twin precedes each perf_gate case (same app/config on both drivers).
  shape:
    threads: [4, 16]
- id: model_parity-copy-mcast
  check: model_parity
  via: blackbox
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-copy-mcast
  check: perf_gate
  via: blackbox
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
  # Not warp-width swept: the multicast kernel ties its tile geometry to the warp
  # width (it asserts tile_cols == NUM_THREADS for a single-warp CTA).
# DXA-staged shared-memory SGEMM (sgemm2 kernel with DXA operand producer).
# tile 4 fits one 16-thread block on the default NT4/NW4 core.
- id: model_parity-sgemm2-dxa
  check: model_parity
  via: blackbox
  app: sgemm2_dxa
  args: -n128 -t4 -m1
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-sgemm2-dxa
  check: perf_gate
  via: blackbox
  app: sgemm2_dxa
  args: -n128 -t4 -m1
  configs: -DVX_CFG_EXT_DXA_ENABLE
# DXA-staged SGEMM with multicast fetch of the shared operand.
  shape:
    threads: [4, 16]
- id: model_parity-sgemm2-dxa-mcast
  check: model_parity
  via: blackbox
  app: sgemm2_dxa_mcast
  args: -n128
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-sgemm2-dxa-mcast
  check: perf_gate
  via: blackbox
  app: sgemm2_dxa_mcast
  args: -n128
  configs: -DVX_CFG_EXT_DXA_ENABLE
# WGMMA consumer fed by a DXA producer pipeline. K stays at 64: the test's
# CPU reference does not replicate the TCU fp32 accumulation order, so K=128
# drifts past the 10-ULP gate.
  shape:
    threads: [4, 16]
- id: model_parity-wgmma-dxa
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg_dxa
  args: -m 128 -n 128 -k 64
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  # Not warp-width swept: a warp-group MMA is defined over a 32-lane warp.
  shape: {threads: 32, warps: 8}
- id: perf_gate-wgmma-dxa
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_dxa
  args: -m 128 -n 128 -k 64
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  # Not warp-width swept: a warp-group MMA is defined over a 32-lane warp.
  shape: {threads: 32, warps: 8}
# The same pipeline with the WGMMA operand reads on the local memory banks'
# read-only port (VX_CFG_LMEM_TCU_RDPORT=1), which a second LSU block brings.
- id: model_parity-wgmma-dxa-rdport
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg_dxa
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=2 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DVX_CFG_LMEM_TCU_RDPORT=1
  # Not warp-width swept: a warp-group MMA is defined over a 32-lane warp.
  shape: {threads: 32, warps: 8}
# Sparse WGMMA consumer fed by a DXA producer pipeline.
- id: model_parity-wgmma-sp-dxa
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg_sp_dxa
  args: -m 128 -n 128 -k 128
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  shape: {threads: 32, warps: 8}
- id: perf_gate-wgmma-sp-dxa
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_sp_dxa
  args: -m 128 -n 128 -k 128
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
  shape: {threads: 32, warps: 8}
# WGMMA + multicast DXA: the large shared operand is broadcast once. K=64 for
# the same reference-tolerance reason as perf_gate-wgmma-dxa.
- id: model_parity-wgmma-dxa-mcast
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg_dxa_mcast
  args: -m 128 -n 128 -k 64
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
- id: perf_gate-wgmma-dxa-mcast
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_dxa_mcast
  args: -m 128 -n 128 -k 64
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1

  shape:
    threads: [4, 16]

# The DXA-staged WGMMA accumulator stored with vx_stm
# (VX_CFG_EXT_LDST_MATRIX_ENABLE).
- id: sgemm_tcu_wg_dxa-ldm
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg_dxa
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_LDST_MATRIX_ENABLE
  shape: {threads: 32, warps: 8}
  touches: [hw/rtl/tcu, hw/rtl/core/VX_uop_packld.sv, hw/rtl/core/VX_decode.sv, sim/simx/tcu, sim/simx/fragment_layout.h, sim/simx/lsu_unit.cpp, sim/simx/decode.cpp, hw/rtl/VX_gpu_pkg.sv, sw/kernel/include/vx_tensor.h, sw/kernel/include/vx_intrinsics.h]
- id: sgemm_tcu_wg_sp_dxa-ldm
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg_sp_dxa
  configs: -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=8 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_LDST_MATRIX_ENABLE
  shape: {threads: 32, warps: 8}
  touches: [hw/rtl/tcu, hw/rtl/core/VX_uop_packld.sv, hw/rtl/core/VX_decode.sv, sim/simx/tcu, sim/simx/fragment_layout.h, sim/simx/lsu_unit.cpp, sim/simx/decode.cpp, hw/rtl/VX_gpu_pkg.sv, sw/kernel/include/vx_tensor.h, sw/kernel/include/vx_intrinsics.h]
- id: sgemm_tcu_wg_dxa_mcast-ldm
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg_dxa_mcast
  configs: -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_LDST_MATRIX_ENABLE
  touches: [hw/rtl/tcu, hw/rtl/core/VX_uop_packld.sv, hw/rtl/core/VX_decode.sv, sim/simx/tcu, sim/simx/fragment_layout.h, sim/simx/lsu_unit.cpp, sim/simx/decode.cpp, hw/rtl/VX_gpu_pkg.sv, sw/kernel/include/vx_tensor.h, sw/kernel/include/vx_intrinsics.h]
